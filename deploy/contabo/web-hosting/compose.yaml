name: antikra-web-hosting

services:
  rembeh-site:
    image: nginx:stable-alpine
    container_name: antikra-rembeh-site
    restart: unless-stopped
    volumes:
      - ./sites/rembeh:/srv/sites/rembeh:ro
      - ./nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    networks:
      - antikra_proxy
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  antikra_proxy:
    external: true
