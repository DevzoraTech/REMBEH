name: antikra-rembeh

services:
  api:
    image: antikra/rembeh-api:${RELEASE_ID:?Set a reviewed release ID}
    container_name: rembeh-api
    restart: unless-stopped
    env_file:
      - ./secrets/aws-ec2.env.snapshot
      - ./secrets/prod-overrides.env
      - ./secrets/redis-client.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      API_PUBLIC_URL: https://rembeh-api.antikra.com
      CORS_ORIGIN: https://rembeh.antikra.com,https://get.rembeh.antikra.com
      REALTIME_CORS_ORIGIN: https://rembeh.antikra.com
      APK_PUBLIC_BASE_URL: ""
      DISABLE_SCHEDULED_JOBS: "0"
      FIREBASE_WEB_SERVICE_ACCOUNT_PATH: /run/secrets/firebase/web.json
      FIREBASE_MOBILE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase/mobile.json
    volumes:
      - ./secrets/firebase:/run/secrets/firebase:ro
    expose:
      - "4000"
    networks:
      - antikra_proxy
      - rembeh_private
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/platform/health').then(r => r.json()).then(b => process.exit(b.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: antikra/rembeh-web:${RELEASE_ID:?Set a reviewed release ID}
    container_name: rembeh-web
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - antikra_proxy
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  antikra_proxy:
    external: true
  rembeh_private:
    external: true
