[antikra]
pg1-path=/var/lib/postgresql/18/docker

[global]
repo1-type=s3
repo1-path=/postgres
repo1-s3-bucket=antikra-db-backups
repo1-s3-endpoint=eu2.contabostorage.com
repo1-s3-region=eu2
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full=7
repo1-bundle=y
repo1-block=y
start-fast=y
log-level-file=off
